name: verify

on:
  push:
  pull_request:

jobs:
  readers-and-paper:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run certificate readers
        run: python Codes/verify_all.py --write-reports --report-dir "$RUNNER_TEMP/planar-recoloring-reports"
      - name: Build main article
        uses: xu-cheng/latex-action@v3
        with:
          root_file: main.tex
          args: -pdf -interaction=nonstopmode -halt-on-error
      - name: Build certificate appendix
        uses: xu-cheng/latex-action@v3
        with:
          root_file: article_certificates.tex
          working_directory: Codes
          args: -pdf -interaction=nonstopmode -halt-on-error
